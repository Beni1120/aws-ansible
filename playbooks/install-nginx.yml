---
- name: configure aws web server
  hosts: aws_servers
  become: true

  tasks:
    - name: update repositories
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: install nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: start nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
